# Server experiment: install beside tpf2_bigmap.so as tpf2_bigmap.cfg.
# Restart the game after changing these switches.
[tpf2_bigmap]
# Completed-block caching did not show a repeatable whole-load gain.
terrain_chunk_cache=0
enabled=1
performance_only=1
terrain_minmax_fast=1
terrain_copy_fast=1
terrain_refine_fast=1
terrain_align_fast=1
# Keep optional disk caching off unless it improves a repeated-load benchmark.
terrain_kernel_cache=0
terrain_kernel_cache_mb=2048
save_fast=0
terrain_cache_compress=0
