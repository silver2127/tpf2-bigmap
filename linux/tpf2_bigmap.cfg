[tpf2_bigmap]
enabled=1
# Windows minimap is not yet ported; requesting it logs a diagnostic only.
minimap=0
add_size_rows=1
newgame_density=1
max_ratio=20
max_tiles=512
street_raster=1
cell_budget_millions=1500
octree=1
octree_depth=11
# Exact terrain scan and faster zstd saves (save files may be larger).
terrain_minmax_fast=1
save_fast=1
# Experimental lossless RAM compression; opt in after reading INSTALL.md.
terrain_cache_compress=0
# Soft budget for uncompressed terrain, not total game RAM.
terrain_cache_hot_mb=1024
# Optional replacement for a stock menu cell (tiles are 256 m each):
# tiles_x=224
# tiles_y=224
# size_index=6
# format_index=0
# Or explicit cells: size7_format0=128x128, size_label7=Custom

# New allocations consume terrain pages only on first read/write.
terrain_lazy_zero=1
# Share identical compressed tiles; full byte comparison guards hash collisions.
terrain_dedup=1
# Optional hash-group census every 120 seconds; can stall writers while hashing.
terrain_dedup_probe=0
# Native float constants; 0/negative keeps stock, positive clamps to 60..86400.
travel_time_limit_s=0
cargo_path_time_s=0
# Awaiting Linux lifetime validation. Requesting these logs a diagnostic.
terrain_blocks=0
alignment_batch_tiles=0
# Windows warm budgets, commit backpressure and adaptive eviction are not ported.
