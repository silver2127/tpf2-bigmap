[tpf2_bigmap]
# Experimental completed-block resident cache. Verify mode runs original work
# on every hit and compares bytes; neither option changes the default path.
terrain_chunk_cache=0
terrain_chunk_cache_mb=1024
terrain_chunk_verify=1
enabled=1
# Enable only explicitly configured terrain/save optimizations on a server.
performance_only=0
add_size_rows=1
newgame_density=1
max_ratio=20
max_tiles=512
street_raster=1
cell_budget_millions=1500
octree=1
octree_depth=11
# Exact terrain scan and faster zstd saves (save files may be larger).
terrain_minmax_fast=1
# Exact native row-copy optimization; opt in after workload timing.
terrain_copy_fast=0
# Native build 35924 kernels, checked against the original Linux machine code.
terrain_refine_fast=0
terrain_align_fast=0
# Persistent exact-input cache; optional, workload dependent (can be slower).
terrain_kernel_cache=0
terrain_kernel_cache_mb=2048
save_fast=1
# Experimental lossless RAM compression; opt in after reading INSTALL.md.
terrain_cache_compress=0
# Soft budget for uncompressed terrain, not total game RAM.
terrain_cache_hot_mb=1024
# Optional replacement for a stock menu cell (tiles are 256 m each):
# tiles_x=224
# tiles_y=224
# size_index=6
# format_index=0
# Or explicit cells: size7_format0=128x128, size_label7=Custom
