# Builds TpF2BigMaps.msi the way a release does: installer\build_msi.ps1
# (build.bat -> out\tpf2_bigmap.dll, the vendored shared binaries, wix build,
# then an administrative-install validation). Every push to dev/main and every
# pull request gets the MSI and its checksum as an artifact; a v* tag also gets
# a draft GitHub release with them attached.
#
# build.bat finds the runner's Visual Studio through vswhere, so no Build Tools
# path is assumed. WiX v7 is installed as a .NET global tool; passing
# -AcceptWixEula means the repository owner accepts the WiX Open Source
# Maintenance Fee terms (https://wixtoolset.org/osmf/) for CI builds.
#
# The runner has no tpf2-multiplayer checkout beside this one, so the script's
# own PluginHost.wxs drift check would be skipped; the "Shared fragment" step
# fetches the multiplayer copy at the release recorded in vendor\VENDORED.md
# and compares it instead (line endings aside, like the script does).
name: Build MSI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write   # release upload on tags; read-only is enough for everything else

concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content installer\VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "installer\VERSION is not a three-part version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*' -and $ref -ne "refs/tags/v$v") {
            throw "tag $ref does not match installer\VERSION ($v): bump VERSION before tagging"
          }
          "installer\VERSION = $v"

      - name: Shared fragment matches the vendored multiplayer release
        shell: pwsh
        run: |
          $rel = (Select-String -Path installer\vendor\VENDORED.md -Pattern '^source release:\s*(v\S+)').Matches[0].Groups[1].Value
          if (-not $rel) { throw "installer\vendor\VENDORED.md names no source release" }
          $url = "https://raw.githubusercontent.com/silver2127/tpf2-multiplayer/$rel/installer/PluginHost.wxs"
          "comparing installer\PluginHost.wxs with $url"
          $theirs = (Invoke-WebRequest -Uri $url -UseBasicParsing).Content -replace "`r`n", "`n"
          $ours = [IO.File]::ReadAllText("installer\PluginHost.wxs") -replace "`r`n", "`n"
          if ($ours -cne $theirs) { throw "installer\PluginHost.wxs differs from the tpf2-multiplayer copy at $rel -- the two packages must share it" }
          "PluginHost.wxs matches tpf2-multiplayer $rel"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: WiX Toolset v7
        run: |
          dotnet tool install --global wix
          wix --version

      - name: Build the MSI
        run: powershell -ExecutionPolicy Bypass -File installer\build_msi.ps1 -AcceptWixEula -Validate

      - name: Checksums
        shell: pwsh
        working-directory: installer/out
        run: |
          $msi = "TpF2BigMaps-${{ steps.version.outputs.version }}.msi"
          Get-FileHash $msi -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TpF2BigMaps-${{ github.sha }}
          path: |
            installer/out/TpF2BigMaps-${{ steps.version.outputs.version }}.msi
            installer/out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/out/TpF2BigMaps-${{ steps.version.outputs.version }}.msi
            installer/out/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
